# Le dépôt se vérifie sur une machine nue : les pages HTML sont versionnées, et
# rien ne garantit sans cela qu'elles correspondent encore aux modules Python
# qui les écrivent.
#
# Il se vérifie aussi chaque matin sans qu'aucun commit ne le demande : des
# phrases du site ont une date de péremption (src/immigration/echeances.py),
# et le jour où l'une d'elles devient fausse, c'est le calendrier qui a changé,
# pas le dépôt. Un échec planifié est signalé par courriel au propriétaire du
# dépôt.
name: Vérifier le site

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * *"   # 6 h à Paris l'hiver
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages à jour, liens, ancres, ressources et échéances
        run: python scripts/verifier.py
      - name: Tests du chiffrage
        run: python -m unittest discover -s tests -v
